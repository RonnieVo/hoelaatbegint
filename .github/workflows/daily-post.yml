name: Instagram dagprogramma (07:00) en weekoverzicht (maandag 08:00)

on:
  schedule:
    # 05:00 en 06:00 UTC: het script post alleen als het in Nederland 07:00 is (zomer- én wintertijd)
    - cron: "0 5,6 * * *"
    - cron: "30 6,7 * * *"   # reserve: GitHub start soms een uur te laat
    - cron: "0 6,7 * * 1"    # maandag: weekoverzicht om 08:00 NL-tijd
  workflow_dispatch:
    inputs:
      mode: { description: "daily of week", default: "daily" }

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_VERIFY_MODE: ${{ vars.AI_VERIFY_MODE }}
      AI_CAPTIONS: ${{ vars.AI_CAPTIONS }}
      AI_WRITE: ${{ vars.AI_WRITE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium

      - name: Bepalen wat er gepost moet worden
        id: plan
        run: |
          H=$(TZ=Europe/Amsterdam date +%H); D=$(TZ=Europe/Amsterdam date +%F); DOW=$(TZ=Europe/Amsterdam date +%u)
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "$H" = "06" ] || [ "$H" = "07" ] || [ "$H" = "08" ] || [ "$H" = "09" ]; then MODE=daily; else MODE=skip; fi
            if [ "$DOW" = "1" ] && [ "$H" != "07" ] && [ ! -f "social/posts/week-$D.jpg" ] && [ -f "social/posts/daily-$D.jpg" ]; then MODE=week; fi
          fi
          # nooit twee keer hetzelfde posten (GitHub start geplande runs soms te laat of dubbel)
          if [ "$MODE" = "daily" ] && [ -f "social/posts/daily-$D.jpg" ]; then MODE=skip; fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT; echo "date=$D" >> $GITHUB_OUTPUT
          if [ "$MODE" = "week" ]; then echo "name=week-$(TZ=Europe/Amsterdam date -d "$D -$((DOW-1)) days" +%F)" >> $GITHUB_OUTPUT; else echo "name=daily-$D" >> $GITHUB_OUTPUT; fi

      - name: Afbeelding maken en bewaren in social/posts (Zapier leest social/feed.xml)
        if: steps.plan.outputs.mode != 'skip'
        run: |
          python site/build.py
          python social/render.py ${{ steps.plan.outputs.mode }} ${{ steps.plan.outputs.date }}
          N=${{ steps.plan.outputs.name }}
          mkdir -p social/posts
          cp dist/social/$N.jpg social/posts/$N.jpg
          cp dist/social/$N.txt social/posts/$N.txt
          date +%s > social/posts/$N.ts
          find social/posts -type f -mtime +21 -delete
          git config user.name "hoelaatbegint-bot"; git config user.email "bot@hoelaatbegint.nl"
          git add social/posts
          git commit -m "Instagram-post $N" || echo "niets nieuws"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          python site/build.py

      - name: Online zetten (afbeelding + feed)
        if: steps.plan.outputs.mode != 'skip' && env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hoelaatbegint --branch=main

      - name: Plaatsen via de Instagram-API (alleen als IG_ACCESS_TOKEN is ingesteld; anders doet Zapier het via de feed)
        if: steps.plan.outputs.mode != 'skip' && env.HAS_CLOUDFLARE == 'true' && env.IG_ACCESS_TOKEN != ''
        run: sleep 30 && python social/publish_instagram.py ${{ steps.plan.outputs.name }}
