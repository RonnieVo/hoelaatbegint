name: Weekrapport en titeltests (maandag)

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch: {}

jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt google-auth requests
      - run: python site/build.py && python pipeline/weekly.py
      - run: |
          git config user.name "hoelaatbegint-bot"; git config user.email "bot@hoelaatbegint.nl"
          git add data/title_overrides.json; git diff --cached --quiet || (git commit -m "Titeltests bijgewerkt" && git push)
