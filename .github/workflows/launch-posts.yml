name: Startposts plaatsen (eenmalig)

on:
  workflow_dispatch: {}

jobs:
  launch:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Site bouwen met de startposts erin
        run: |
          python site/build.py
          mkdir -p dist/social/launch && cp social/launch/*.jpg dist/social/launch/
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hoelaatbegint --branch=main
      - name: Plaatsen op Instagram
        run: sleep 30 && python social/publish_launch.py
